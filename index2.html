<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colpo d'occhio - Giochiamo Insieme</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Lexend:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Lexend', 'Fredoka', sans-serif; user-select: none; -webkit-user-select: none; overflow-x: hidden; }
        .dobble-card { aspect-ratio: 1 / 1; box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.4), 0 0 30px inset rgba(255, 255, 255, 0.9); transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); overflow: visible !important; }
        .dobble-card:hover { transform: scale(1.02); }
        .symbol-item { transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275); cursor: pointer; position: absolute; display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 9999px; padding: 0; }
        .symbol-item:hover { z-index: 40 !important; transform: scale(1.15); }
        .symbol-correct { animation: pulse-green 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275); z-index: 50 !important; }
        .symbol-wrong { animation: shake-red 0.5s ease-in-out; }
        .locked-card { opacity: 0.35 !important; pointer-events: none !important; filter: grayscale(80%); }
        @keyframes pulse-green { 0% { transform: scale(1); } 50% { transform: scale(1.5); } 100% { transform: scale(1); } }
        @keyframes shake-red { 0%, 100% { transform: translateX(0); } 20%, 60% { transform: translateX(-10px); } 40%, 80% { transform: translateX(10px); } }
        @keyframes card-appear { 0% { opacity: 0; transform: scale(0.65) rotate(-12deg); } 100% { opacity: 1; transform: scale(1) rotate(0deg); } }
        .animate-card { animation: card-appear 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #2e1065; border-radius: 8px; }
        ::-webkit-scrollbar-thumb { background: #6b21a8; border-radius: 8px; }
    </style>
</head>
<body class="bg-gradient-to-br from-purple-950 via-purple-900 to-indigo-950 text-slate-100 min-h-screen flex flex-col justify-between">

    <!-- HEADER -->
    <header class="w-full bg-purple-900/90 backdrop-blur-md border-b border-purple-700/50 px-4 py-3 flex justify-between items-center z-10 shadow-lg">
        <div class="flex items-center gap-3">
            <div class="bg-amber-400 text-purple-950 p-2.5 rounded-2xl shadow-lg flex items-center justify-center font-bold text-xl">
                <i class="fa-solid fa-eye"></i>
            </div>
            <div>
                <h1 class="text-xl md:text-2xl font-bold text-white tracking-wide flex items-center gap-2">Colpo d'occhio</h1>
                <p class="text-xs text-purple-200 hidden sm:block">Tocca l'immagine in comune o dilla al microfono!</p>
            </div>
        </div>

        <div class="flex items-center gap-2 md:gap-3 flex-wrap justify-end">
            <button id="btn-multiplayer" onclick="mostraModalConnessione()" class="px-3.5 py-2 rounded-xl bg-amber-400 hover:bg-amber-300 text-purple-950 font-bold transition flex items-center gap-2 text-xs md:text-sm shadow-md">
                <i class="fa-solid fa-users"></i><span id="txt-multiplayer">Giochiamo insieme</span>
            </button>
            <button id="btn-mic-toggle" onclick="toggleSpeechRecognition()" class="px-3.5 py-2 rounded-xl bg-purple-800/80 hover:bg-purple-700 text-purple-100 transition flex items-center gap-2 text-xs md:text-sm border border-purple-600/50 shadow-sm" title="Attiva/Disattiva Microfono">
                <!-- PARTE DEFAULT OFF -->
                <i id="mic-icon" class="fa-solid fa-microphone-slash text-purple-400"></i>
                <span id="mic-status-text" class="hidden md:inline font-medium">Mic: OFF</span>
            </button>
        </div>
    </header>

    <!-- AREA DI GIOCO -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 py-2 flex flex-col justify-center items-center gap-3">
        <!-- STATUS BAR -->
        <div class="w-full flex flex-col sm:flex-row justify-between items-center bg-purple-900/80 backdrop-blur-md rounded-2xl p-3 border border-purple-700/50 text-white shadow-xl gap-3">
            <div class="flex items-center gap-2">
                <span id="connected-players-badge" class="bg-purple-500/20 border border-purple-400/40 text-purple-200 text-xs sm:text-sm font-semibold px-2.5 py-1 rounded-full hidden">
                    <i class="fa-solid fa-user-group"></i> Alunni: <b id="players-count">0</b>
                </span>
            </div>
            <div class="flex items-center gap-6">
                <div id="timer-box" class="hidden flex items-center gap-2">
                    <i class="fa-solid fa-stopwatch text-amber-300 text-xl"></i>
                    <span id="timer-display" class="text-2xl font-bold font-mono text-amber-300">60</span>s
                </div>
                <div class="flex items-center gap-2 bg-amber-400/10 border border-amber-400/30 px-3.5 py-1 rounded-xl">
                    <i class="fa-solid fa-star text-amber-300"></i>
                    <span class="text-xs font-semibold uppercase text-amber-200">Punti:</span>
                    <span id="score-display" class="text-xl font-bold text-white">0</span>
                </div>
            </div>
        </div>

        <!-- BARRA MICROFONO (NASCOSTA DI DEFAULT) -->
        <div id="speech-live-bar" class="hidden w-full bg-emerald-500/20 border border-emerald-400/40 text-emerald-200 text-center py-1.5 px-4 rounded-xl text-xs font-semibold flex items-center justify-center gap-2 animate-pulse">
            <i class="fa-solid fa-microphone text-emerald-400 text-sm"></i>
            <span>In ascolto... <span class="text-purple-300 font-normal">(Hai detto: <b id="speech-heard-text" class="text-amber-300 font-bold">...</b>)</span></span>
        </div>

        <!-- CARTE -->
        <div class="w-full flex-1 flex flex-col md:flex-row items-center justify-center gap-4 md:gap-8 my-1">
            <div id="card1" class="dobble-card animate-card w-full max-w-[340px] md:max-w-[460px] bg-gradient-to-b from-yellow-100 to-yellow-300 rounded-full border-8 border-purple-900 relative"></div>
            <div class="bg-amber-400 text-purple-950 w-12 h-12 rounded-full flex items-center justify-center font-black text-2xl shadow-xl border-4 border-purple-950 z-10"><i class="fa-solid fa-equals"></i></div>
            <div id="card2" class="dobble-card animate-card w-full max-w-[340px] md:max-w-[460px] bg-gradient-to-b from-yellow-100 to-yellow-300 rounded-full border-8 border-purple-900 relative"></div>
        </div>

        <!-- CONTROLLI (SOLO HOST/SINGOLO) -->
        <div id="host-controls" class="flex flex-wrap justify-center gap-3 mt-1">
            <button onclick="nextPair(true)" class="px-4 py-2 rounded-xl bg-purple-800 hover:bg-purple-700 text-purple-100 font-semibold border border-purple-600/50 text-sm"><i class="fa-solid fa-arrows-rotate"></i> Cambia Carte</button>
            <button onclick="avviaTimer()" class="px-5 py-2 rounded-xl bg-gradient-to-r from-amber-400 to-yellow-400 text-purple-950 font-bold shadow-lg text-sm"><i class="fa-solid fa-play"></i> Avvia Sfida 60s</button>
        </div>
    </main>

    <!-- MODALE CONNESSIONE -->
    <div id="connection-modal" class="fixed inset-0 bg-purple-950/90 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
        <div class="bg-purple-900 border border-purple-700 w-full max-w-md rounded-3xl p-6 text-white shadow-2xl flex flex-col">
            <h2 class="text-xl font-bold mb-4 text-amber-300"><i class="fa-solid fa-users"></i> Giochiamo Insieme</h2>
            
            <div id="role-selection" class="space-y-4">
                <button onclick="avviaComeDocente()" class="w-full p-4 rounded-2xl bg-fuchsia-600 font-bold flex items-center gap-4 text-left">
                    <i class="fa-solid fa-desktop text-3xl"></i>
                    <div>Crea una Stanza (LIM/Host)<div class="text-xs font-normal">Genera PIN per gli alunni</div></div>
                </button>
                <div class="border-t border-purple-700 my-2"></div>
                <div class="space-y-2">
                    <input type="text" id="student-name" placeholder="Il tuo Nome" class="w-full bg-purple-950 border p-3 rounded-xl text-center text-white outline-none">
                    <input type="text" id="room-pin-input" placeholder="PIN (es. 1234)" maxlength="4" class="w-full bg-purple-950 border p-3 rounded-xl text-center text-lg tracking-widest text-white outline-none">
                    <button onclick="connettiComeStudente()" class="w-full py-3 rounded-xl bg-amber-400 text-purple-950 font-bold">Entra</button>
                </div>
            </div>

            <div id="teacher-qr-view" class="hidden flex-col items-center text-center space-y-4 mt-4">
                <div class="bg-white p-3 rounded-2xl" id="qrcode-box"></div>
                <div class="text-lg font-bold text-amber-300">PIN: <span id="display-pin-code" class="text-2xl font-mono text-white bg-purple-950 px-3 py-1 rounded-xl">----</span></div>
            </div>
            <button onclick="document.getElementById('connection-modal').classList.add('hidden')" class="mt-6 w-full py-2 rounded-xl bg-purple-950 text-purple-300 text-sm font-semibold">Chiudi</button>
        </div>
    </div>

    <script>
        // DATI DI GIOCO DI BASE (Esempio Simboli)
        const allSymbols = ["❤️ Cuore", "⭐ Stella", "☀️ Sole", "🌙 Luna", "☁️ Nuvola", "⚡ Fulmine", "❄️ Neve", "🔥 Fuoco", "💧 Goccia", "🍎 Mela", "🍌 Banana", "🍇 Uva", "🍓 Fragola", "🍕 Pizza", "🍔 Hamburger", "🍟 Patatine", "🍩 Ciambella", "🍪 Biscotto", "🍦 Gelato", "🍫 Cioccolato", "🏀 Basket", "⚽ Calcio", "🎾 Tennis", "⚾ Baseball", "🎱 Biliardo", "🚗 Auto", "🚕 Taxi", "🚓 Polizia", "🚑 Ambulanza", "🚒 Pompieri", "✈️ Aereo", "🚀 Razzo", "🚁 Elicottero", "⛵ Barca", "🚢 Nave", "🚲 Bici", "🛵 Moto", "🚜 Trattore", "🐶 Cane", "🐱 Gatto", "🐭 Topo", "🐹 Cralo", "🐰 Coniglio", "🦊 Volpe", "🐻 Orso", "🐼 Panda", "🐨 Koala", "🐯 Tigre", "🦁 Leone", "🐮 Mucca", "🐷 Maiale", "🐸 Rana", "🐵 Scimmia", "🐔 Gallina", "🐧 Pinguino", "🐦 Uccello", "🐤 Pulcino"];
        
        // STATO DI GIOCO
        let state = {
            deck: [], card1: [], card2: [], matchingSymbol: "", score: 0,
            isHost: false, isStudent: false, timer: 60, timerInterval: null
        };

        // VARIABILI PEERJS & MULTIPLAYER
        let peer = null;
        let connDocente = null;
        let connessioniStudenti = [];
        let mioNomeStudente = "";

        // VARIABILI MICROFONO (DEFAULT OFF)
        let recognition = null;
        let isSpeechRecognitionActive = false; // <-- QUI IL DEFAULT E' IMPOSTATO SU FALSE

        // Inizializzazione Riconoscimento Vocale (se supportato)
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.lang = 'it-IT';
            recognition.continuous = true;
            recognition.interimResults = false;

            recognition.onresult = (event) => {
                const transcript = event.results[event.results.length - 1][0].transcript.trim().toLowerCase();
                document.getElementById('speech-heard-text').textContent = transcript;
                controllaRisposta(transcript, true);
            };

            recognition.onend = () => {
                if (isSpeechRecognitionActive) recognition.start(); // Riavvia se è ancora attivo
            };
        }

        // --- LOGICA MICROFONO ---
        function toggleSpeechRecognition() {
            if (!recognition) {
                alert("Riconoscimento vocale non supportato in questo browser. Usa Chrome o Edge.");
                return;
            }
            
            isSpeechRecognitionActive = !isSpeechRecognitionActive;
            const icon = document.getElementById('mic-icon');
            const text = document.getElementById('mic-status-text');
            const liveBar = document.getElementById('speech-live-bar');

            if (isSpeechRecognitionActive) {
                recognition.start();
                icon.className = "fa-solid fa-microphone text-emerald-400";
                text.textContent = "Mic: ON";
                liveBar.classList.remove('hidden');
            } else {
                recognition.stop();
                icon.className = "fa-solid fa-microphone-slash text-purple-400";
                text.textContent = "Mic: OFF";
                liveBar.classList.add('hidden');
            }
        }

        // --- LOGICA GIOCO E CARTE ---
        function generaMazzoDobble(n = 7) {
            // Genera mazzo piano proiettivo
            let cards = [];
            for (let i = 0; i <= n; i++) {
                let card = [allSymbols[0]];
                for (let j = 0; j < n; j++) card.push(allSymbols[(i * n) + j + 1]);
                cards.push(card);
            }
            for (let i = 0; i < n; i++) {
                for (let j = 0; j < n; j++) {
                    let card = [allSymbols[i + 1]];
                    for (let k = 0; k < n; k++) {
                        let val = (n + 1) + n * k + ((i * k + j) % n);
                        card.push(allSymbols[val]);
                    }
                    cards.push(card);
                }
            }
            return cards;
        }

        function nextPair(broadcast = false) {
            if(state.deck.length === 0) state.deck = generaMazzoDobble(7);
            
            let idx1 = Math.floor(Math.random() * state.deck.length);
            let idx2 = Math.floor(Math.random() * state.deck.length);
            while(idx1 === idx2) idx2 = Math.floor(Math.random() * state.deck.length);

            state.card1 = state.deck[idx1];
            state.card2 = state.deck[idx2];
            
            // Trova simbolo comune
            state.matchingSymbol = state.card1.find(sym => state.card2.includes(sym));

            disegnaCarte();

            if (broadcast && state.isHost) {
                connessioniStudenti.forEach(conn => {
                    conn.send({ tipo: 'AGGIORNA_CARTE', card1: state.card1, card2: state.card2, matchingSymbol: state.matchingSymbol });
                });
            }
        }

        function disegnaCarte() {
            const renderCard = (cardData, elementId) => {
                const container = document.getElementById(elementId);
                container.innerHTML = '';
                // Rimuove e rimette classe per animazione
                container.classList.remove('animate-card');
                void container.offsetWidth; 
                container.classList.add('animate-card');

                cardData.forEach((sym, i) => {
                    let el = document.createElement('div');
                    el.className = 'symbol-item text-xl md:text-3xl font-bold bg-white/80 p-2 rounded-xl shadow-sm border border-purple-200';
                    // Posizionamento sparso circolare approssimativo
                    const angle = (i / cardData.length) * Math.PI * 2;
                    const radius = 35 + Math.random() * 15; // tra 35% e 50%
                    el.style.left = `calc(50% + ${Math.cos(angle) * radius}% - 20px)`;
                    el.style.top = `calc(50% + ${Math.sin(angle) * radius}% - 20px)`;
                    
                    let [emoji, ...textArr] = sym.split(" ");
                    el.innerHTML = `<span class="text-4xl drop-shadow-md">${emoji}</span><span class="text-xs mt-1 text-purple-900">${textArr.join(" ")}</span>`;
                    
                    el.onclick = () => controllaRisposta(sym, false);
                    container.appendChild(el);
                });
            };
            renderCard(state.card1, 'card1');
            renderCard(state.card2, 'card2');
        }

        function controllaRisposta(risposta, isVocale) {
            let nomeRisposta = isVocale ? risposta : risposta;
            let matchText = state.matchingSymbol.toLowerCase();
            
            // Controllo tollerante (se vocale) o esatto (se click)
            let isCorrect = isVocale ? matchText.includes(nomeRisposta) : (risposta === state.matchingSymbol);

            if (isCorrect) {
                confetti({ particleCount: 50, spread: 60, origin: { y: 0.8 } });
                state.score += 10;
                document.getElementById('score-display').textContent = state.score;
                
                if (state.isStudent && connDocente) {
                    connDocente.send({ tipo: 'RISPOSTA_CORRETTA', nome: mioNomeStudente, score: state.score });
                } else {
                    setTimeout(() => nextPair(true), 1000); // Docente cambia carta
                }
            } else if (!isVocale) {
                alert("Sbagliato! Riprova."); // Feedback semplice
            }
        }

        // --- TIMER LOGIC ---
        function avviaTimer() {
            state.timer = 60;
            document.getElementById('timer-box').classList.remove('hidden');
            document.getElementById('timer-display').textContent = state.timer;
            
            if (state.isHost) {
                connessioniStudenti.forEach(c => c.send({ tipo: 'START_TIMER' }));
            }

            if(state.timerInterval) clearInterval(state.timerInterval);
            state.timerInterval = setInterval(() => {
                state.timer--;
                document.getElementById('timer-display').textContent = state.timer;
                if (state.isHost) connessioniStudenti.forEach(c => c.send({ tipo: 'SYNC_TIMER', time: state.timer }));
                
                if (state.timer <= 0) {
                    clearInterval(state.timerInterval);
                    alert("Tempo scaduto! Punti: " + state.score);
                }
            }, 1000);
        }

        // --- MULTIPLAYER E HANDSHAKE ---
        function mostraModalConnessione() { document.getElementById('connection-modal').classList.remove('hidden'); }

        function avviaComeDocente() {
            const pin = Math.floor(1000 + Math.random() * 9000).toString();
            const peerId = `colpo-docente-${pin}`;
            
            peer = new Peer(peerId);
            
            peer.on('open', (id) => {
                state.isHost = true;
                document.getElementById('role-selection').classList.add('hidden');
                document.getElementById('teacher-qr-view').classList.remove('hidden');
                document.getElementById('teacher-qr-view').classList.add('flex');
                document.getElementById('display-pin-code').textContent = pin;
                document.getElementById('connected-players-badge').classList.remove('hidden');
                
                new QRCode(document.getElementById("qrcode-box"), {
                    text: pin, width: 150, height: 150
                });
            });

            // MODIFICA 1: LA LIM ASPETTA CHE LO STUDENTE SIA PRONTO
            peer.on('connection', (conn) => {
                connessioniStudenti.push(conn);
                document.getElementById('players-count').textContent = connessioniStudenti.length;

                conn.on('data', (dati) => {
                    // HANDSHAKE: Inviamo i dati solo quando il telefono dice di essere pronto
                    if (dati.tipo === 'STUDENTE_PRONTO') {
                        conn.send({
                            tipo: 'AGGIORNA_CARTE',
                            card1: state.card1,
                            card2: state.card2,
                            matchingSymbol: state.matchingSymbol
                        });
                        if (state.timer < 60 && state.timer > 0) {
                            conn.send({ tipo: 'START_TIMER' });
                            conn.send({ tipo: 'SYNC_TIMER', time: state.timer });
                        }
                    }
                    else if (dati.tipo === 'RISPOSTA_CORRETTA') {
                        // Lo studente ha indovinato, cambia carte per tutti
                        nextPair(true);
                    }
                });

                conn.on('close', () => {
                    connessioniStudenti = connessioniStudenti.filter(c => c !== conn);
                    document.getElementById('players-count').textContent = connessioniStudenti.length;
                });
            });
        }

        function connettiComeStudente() {
            const pin = document.getElementById('room-pin-input').value.trim();
            mioNomeStudente = document.getElementById('student-name').value.trim() || "Studente";
            
            if (pin.length !== 4) return alert("Inserisci un PIN di 4 cifre.");
            
            if (!peer) peer = new Peer(); // Inizializza peer se non esiste
            
            peer.on('open', () => {
                connDocente = peer.connect(`colpo-docente-${pin}`);
                
                connDocente.on('open', () => {
                    document.getElementById('connection-modal').classList.add('hidden');
                    document.getElementById('txt-multiplayer').textContent = `Connesso: ${mioNomeStudente}`;
                    document.getElementById('host-controls').classList.add('hidden'); // Nasconde controlli host
                    state.isStudent = true;

                    // MODIFICA 2: IL TELEFONO E' PRONTO, BUSSA ALLA LIM
                    connDocente.send({ tipo: 'STUDENTE_PRONTO' });
                });

                connDocente.on('data', (dati) => {
                    if (dati.tipo === 'AGGIORNA_CARTE') {
                        state.card1 = dati.card1;
                        state.card2 = dati.card2;
                        state.matchingSymbol = dati.matchingSymbol;
                        disegnaCarte();
                    } else if (dati.tipo === 'START_TIMER') {
                        document.getElementById('timer-box').classList.remove('hidden');
                    } else if (dati.tipo === 'SYNC_TIMER') {
                        document.getElementById('timer-display').textContent = dati.time;
                    }
                });
            });
        }

        // Inizializza primo mazzo all'avvio
        nextPair();

    </script>
</body>
</html>
